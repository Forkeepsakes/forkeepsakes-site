<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact - ForKeepSakes</title>

  <link rel="stylesheet" href="style.css" />

  <style>
    /* Wood grain background; allow page to scroll */
    body.contact {
      background: url("images/oak-grain.png") center/cover no-repeat fixed;
      overflow: auto;
    }

    /* Full-viewport feel without trapping content */
    .contact-wrap {
      min-height: calc(100vh - 80px);
      display: grid;
      grid-template-rows: auto auto auto;
      justify-items: center;
      align-content: center;
      gap: 18px;
      padding: 20px;
    }

    .contact-card {
      max-width: 840px;
      background: rgba(255,255,255,0.9);
      color: #333;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.2);
      padding: 24px 22px;
      text-align: center;
    }
    .contact-card h1 {
      font-size: 2rem;
      margin: 0 0 10px;
      color: var(--accent);
      text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
    }
    .contact-card p {
      margin: 8px 0;
      font-size: 1.1rem;
      line-height: 1.6;
    }

    /* Button row */
    .contact-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 10px;
    }
    .btn {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 8px;
      background: var(--btn);
      color: #fff;
      text-decoration: none;
      transition: background .2s ease;
      box-shadow: 0 8px 22px rgba(0,0,0,.25);
      font-weight: 700;
    }
    .btn:hover { background: var(--btn-hover); }

    .contact-logo {
      max-width: min(260px, 45vw);
      height: auto;
      display: block;
      filter: drop-shadow(0 6px 16px rgba(0,0,0,.25));
    }

    /* Tiny-height safety */
    @media (max-height: 620px) {
      .contact-card { padding: 18px; }
      .contact-card h1 { font-size: 1.6rem; }
      .contact-card p { font-size: 1rem; }
      .contact-logo { max-width: min(200px, 50vw); }
      .contact-wrap { gap: 12px; }
    }
  </style>
</head>
<body class="contact">
  <header>
    <nav class="nav" aria-label="Main">
      <a href="index.html">Home</a>
      <a href="gallery.html">Gallery</a>
      <a href="create-with-forkeepsakes.html">Create</a>
      <a href="acknowledgement.html">Acknowledgement</a>
    </nav>
  </header>

  <main>
    <section class="contact-wrap" aria-label="Contact ForKeepSakes">
      <div class="contact-card">
        <h1>Contact ForKeepSakes</h1>
        <p>All feedback is welcome, and ForKeepSakes is grateful for the support of every visitor and supporter.</p>
        <p>If you’d like to reach out directly, use the options below.</p>

        <div class="contact-actions" aria-label="Contact options">
          <a class="btn" href="mailto:forkeepsakesfks@gmail.com">Email Us</a>
          <a class="btn" href="https://www.tiktok.com/@forkeepsakes" target="_blank" rel="noopener">TikTok @ForKeepSakes</a>
          <a class="btn" href="create-with-forkeepsakes.html#support">Support the Craft</a>
        </div>
      </div>

      <img src="images/FKS-logo.png" alt="ForKeepSakes Logo" class="contact-logo" />
    </section>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
